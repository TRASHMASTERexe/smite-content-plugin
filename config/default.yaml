# Smite 2 Plugin Base — Default Configuration
# Edit these values to match your setup.

obs:
  host: "localhost"
  port: 4455
  password: "HRkuqKxb0Fj7CFNb"            # Set in OBS: Tools → WebSocket Server Settings

screen:
  capture_interval: .1   # Seconds between screen captures
  monitor: 1              # Monitor index to capture (1 = primary)

audio:
  sounds_dir: "resources/sounds"    # Relative to project root
  device: "Speakers (2- VB-Audio Virtual Cable)"  # null = system default
                                     # For OBS capture: "CABLE Input (VB-Audio Virtual Cable)"
                                     # Get VB-Audio free at: https://vb-audio.com/Cable
  master_volume: 0.25                 # Global volume multiplier (0.0–1.0)

text:
  output_dir: "resources/output"    # Relative to project root

player:
  name: "TrashMaster.exe"    # Your in-game username (used for kill/death detection)

###### DEATH SOUNDS #######
death_sounds:
  volume: .25             # 0.0 (silent) to 1.0 (full)


###### BLOOD SCREEN KILL STREAK #######
blood_screen_kill_streak:
  image_name: "Rage Outline"    # Name of the image in OBS
  filter_name: "Opacity"    # Name of the filter in OBS applied to the image



###### UNIVERSAL HOTKEYS #######
hotkeys:
  ocr_toggle: "ctrl+shift+o"   # Toggle OCR capture on/off

logging:
  level: "DEBUG"           # DEBUG | INFO | WARNING | ERROR
